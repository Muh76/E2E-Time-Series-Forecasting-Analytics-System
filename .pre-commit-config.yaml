# Hooks run locally on every commit (install with: pre-commit install).
# The CI Format Check job runs `pre-commit run --all-files` on every push
# and pull request, so formatting violations block the entire pipeline.
#
# To auto-fix locally before pushing:
#   pre-commit run --all-files
#
# To install hooks so they run automatically on git commit:
#   pre-commit install

repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length=120]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
          - --extend-ignore=E203
          - --extend-ignore=W503
